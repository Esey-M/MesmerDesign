#
# The Associates tag (mesmerdesign-20) is appended automatically by the
# shortcode — NEVER paste a tag by hand.
#
# Each entry:
#   title  – what the reader sees
#   note   – one line on why it's the right pick
#   search – keyword fallback. Used while `url` is empty; renders a tagged
#            Amazon search link, which still earns on whatever they buy.
#   url    – OPTIONAL. Paste a SiteStripe **Full Link** (not Short Link) here to
#            feature one specific product. Upgrade entries to this as you
#            verify products you'd genuinely recommend.
#
# RULES: never add a price (Amazon forbids showing stale prices), never add an
# Amazon-hosted image URL, and never buy through these links yourself.
# ============================================================

